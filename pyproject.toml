[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-fuzzy"
version = "0.1.0"
description = "Explainable, quality-aware fuzzy stress detection on the WorkStress3D dataset (research prototype)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stress_fuzzy = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
